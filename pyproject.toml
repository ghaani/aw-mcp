[project]
name = "aw-mcp"
version = "0.1.0"
description = "MCP server for AdventureWorksDW analytics"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "pyodbc", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
